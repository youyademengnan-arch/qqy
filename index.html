<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #0f172a, #334155); /* 深邃背景色 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); /* 磨砂玻璃效果 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 90%;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #38bdf8; /* 暂时代替头像的圆圈 */
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        h1 { margin: 10px 0; font-size: 24px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.6; }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { transform: scale(1.05); background: #7dd3fc; }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🚀</div>
        <h1>你好，我是 QQY</h1>
        <p>这是我亲手搭建的第一个个人主页。<br>在这里，我将记录学习和成长的点滴。</p>
        <a href="#" class="btn">联系我</a>
    </div>

</body>
</html>
